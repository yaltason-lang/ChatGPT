name: Build Riverwood v2 package

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-riverwood-v2.yml'
      - 'TRIGGER_RIVERWOOD_V2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2 source branch
        uses: actions/checkout@v4
        with:
          ref: riverwood-hms-compatibility-v2
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip jinja2

      - name: Build and test v2
        run: python build_v2.py

      - name: Verify sidecars untouched
        run: git diff --exit-code -- pms_booking_adapter_v1.py pms_sidecar_with_room_quote_v3.py

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: Riverwood_5SEP_HMS_COMPATIBILITY_AUTOFIX_DASHBOARD_v2
          path: dist/Riverwood_5SEP_HMS_COMPATIBILITY_AUTOFIX_DASHBOARD_v2.zip
          if-no-files-found: error

      - name: Publish ZIP to v2 branch
        run: |
          mkdir -p release
          cp dist/Riverwood_5SEP_HMS_COMPATIBILITY_AUTOFIX_DASHBOARD_v2.zip release/Riverwood_5SEP_HMS_COMPATIBILITY_AUTOFIX_DASHBOARD_v2.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/Riverwood_5SEP_HMS_COMPATIBILITY_AUTOFIX_DASHBOARD_v2.zip
          if git diff --cached --quiet; then
            echo "Verified ZIP already current"
          else
            git commit -m "Publish verified HMS compatibility v2 ZIP [skip ci]"
            git push origin HEAD:riverwood-hms-compatibility-v2
          fi
