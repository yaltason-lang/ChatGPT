name: Build Riverwood Writer V10 Runtime Preflight Guard V1.1

on:
  push:
    branches:
      - riverwood-hms-writer-v10-runtime-preflight-guard-v1
    paths:
      - 'tools/restart_verified_writer_v10_no_cim.ps1'
      - 'tools/APPLY_WRITER_V10_RUNTIME_PREFLIGHT_GUARD_V1_1.bat'
      - 'tools/README_WRITER_V10_RUNTIME_PREFLIGHT_GUARD_V1_1.txt'
      - 'tools/patch_operations_writer_runtime_guard_v1.py'
      - '.github/workflows/build-writer-runtime-preflight-guard-v1-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell 5.1 parse check
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/restart_verified_writer_v10_no_cim.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; exit 1 }
          Write-Host 'PS51 PARSE PASS'

      - name: Static safety assertions
        shell: powershell
        run: |
          $ps = Get-Content 'tools/restart_verified_writer_v10_no_cim.ps1' -Raw
          $bat = Get-Content 'tools/APPLY_WRITER_V10_RUNTIME_PREFLIGHT_GUARD_V1_1.bat' -Raw
          if ($ps -match 'Get-CimInstance|Win32_Process|CommandLine') {
            if ($ps -match 'Get-CimInstance|Win32_Process') { throw 'CIM dependency remains in no-CIM restart script' }
          }
          if ($ps -notmatch '23462d24847e677e6fedaa1bf4cbe863899341d536122a3140a7408abb5926ac') { throw 'Exact writer SHA gate missing' }
          if ($ps -notmatch [regex]::Escape('C:\riverwood_revenue_bot\.venv\Scripts\python.exe')) { throw 'Verified revenue-bot venv Python path missing' }
          if ($ps -notmatch [regex]::Escape('C:\riverwood_revenue_bot\pms_booking_adapter_v5328.py')) { throw 'Writer path missing' }
          if ($ps -notmatch 'Get-NetTCPConnection -LocalPort 8085') { throw ':8085 listener gate missing' }
          if ($ps -match '8082') { throw ':8082 must not be touched by restart script' }
          $guardPos = $bat.IndexOf('patch_operations_writer_runtime_guard_v1.py')
          $restartPos = $bat.IndexOf('restart_verified_writer_v10_no_cim.ps1')
          if ($guardPos -lt 0 -or $restartPos -lt 0 -or $guardPos -gt $restartPos) { throw 'Operations guard must be installed before writer restart' }
          Write-Host 'STATIC SAFETY PASS'

      - name: Python compile and Operations guard compatibility
        shell: powershell
        run: |
          py -3 -m py_compile tools/patch_operations_writer_runtime_guard_v1.py
          py -3 tools/patch_live_operations_earlylate_v1.py --source accommodation_module.py --out ops_earlylate.py --no-sha-gate --no-backup
          py -3 tools/patch_operations_writer_runtime_guard_v1.py --source ops_earlylate.py --out ops_guarded.py --no-backup
          py -3 -m py_compile ops_guarded.py
          $t = Get-Content ops_guarded.py -Raw
          if ($t -notmatch 'RIVERWOOD_HMS_WRITER_V10_RUNTIME_PREFLIGHT_GUARD_V1') { throw 'Runtime preflight guard marker missing' }
          if ($t -notmatch 'writer_runtime_not_ready') { throw 'Runtime preflight conflict missing' }
          Write-Host 'OPERATIONS GUARD COMPAT PASS'

      - name: Build package
        shell: powershell
        run: |
          $pkg = 'Riverwood_5SEP_HMS_WRITER_V10_RUNTIME_PREFLIGHT_GUARD_V1_1_NO_CIM'
          $dir = Join-Path $PWD $pkg
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item 'tools/APPLY_WRITER_V10_RUNTIME_PREFLIGHT_GUARD_V1_1.bat' (Join-Path $dir 'APPLY_WRITER_V10_RUNTIME_PREFLIGHT_GUARD_V1_1.bat')
          Copy-Item 'tools/restart_verified_writer_v10_no_cim.ps1' (Join-Path $dir 'restart_verified_writer_v10_no_cim.ps1')
          Copy-Item 'tools/patch_operations_writer_runtime_guard_v1.py' (Join-Path $dir 'patch_operations_writer_runtime_guard_v1.py')
          Copy-Item 'tools/README_WRITER_V10_RUNTIME_PREFLIGHT_GUARD_V1_1.txt' (Join-Path $dir 'README.txt')
          $zip = Join-Path $PWD ($pkg + '.zip')
          Compress-Archive -Path $dir -DestinationPath $zip -Force
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path ($pkg + '.sha256.txt') -Value $sha -Encoding ascii
          Write-Host ('ZIP SHA256=' + $sha)

      - name: Verify packaged files
        shell: powershell
        run: |
          $pkg = 'Riverwood_5SEP_HMS_WRITER_V10_RUNTIME_PREFLIGHT_GUARD_V1_1_NO_CIM'
          $zip = $pkg + '.zip'
          $out = Join-Path $PWD 'verify_zip'
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $base = Join-Path $out $pkg
          foreach ($f in @('APPLY_WRITER_V10_RUNTIME_PREFLIGHT_GUARD_V1_1.bat','restart_verified_writer_v10_no_cim.ps1','patch_operations_writer_runtime_guard_v1.py','README.txt')) {
            if (-not (Test-Path (Join-Path $base $f))) { throw ('Missing packaged file: ' + $f) }
          }
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $base 'restart_verified_writer_v10_no_cim.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'Packaged PowerShell parse failed' }
          Write-Host 'ZIP VERIFY PASS'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Riverwood_5SEP_HMS_WRITER_V10_RUNTIME_PREFLIGHT_GUARD_V1_1_NO_CIM
          path: |
            Riverwood_5SEP_HMS_WRITER_V10_RUNTIME_PREFLIGHT_GUARD_V1_1_NO_CIM.zip
            Riverwood_5SEP_HMS_WRITER_V10_RUNTIME_PREFLIGHT_GUARD_V1_1_NO_CIM.sha256.txt

      - name: Publish package to branch release folder
        if: github.ref == 'refs/heads/riverwood-hms-writer-v10-runtime-preflight-guard-v1'
        shell: powershell
        run: |
          $pkg = 'Riverwood_5SEP_HMS_WRITER_V10_RUNTIME_PREFLIGHT_GUARD_V1_1_NO_CIM'
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item ($pkg + '.zip') (Join-Path 'release' ($pkg + '.zip')) -Force
          Copy-Item ($pkg + '.sha256.txt') (Join-Path 'release' ($pkg + '.sha256.txt')) -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/
          if (git diff --cached --quiet) { Write-Host 'No release changes'; exit 0 }
          git commit -m 'Publish V1.1 no-CIM writer runtime guard package [skip ci]'
          git push
